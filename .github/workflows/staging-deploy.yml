name: Staging Deploy

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Approved source commit to deploy
        required: true
        default: 30b39ec0034f335bdbda210f09c8ad66a26a25a2
      release_artifact_name:
        description: GitHub Actions artifact name containing the approved RC tarball
        required: true
        default: laborator-editura-1.0.0-rc.1-30b39ec
      release_artifact_sha256:
        description: Expected SHA-256 for the approved RC tarball
        required: true
        default: 9665892b4600387326d4e569de9fbf3a7f08f9ffb565bfda71664fa89f8c792e
      artifact_run_id:
        description: Workflow run ID that uploaded the approved RC artifact
        required: true
      migration_version:
        description: Expected database migration version
        required: true
        default: 0008_security_hardening_phase_1.sql
      api_image:
        description: Approved API runtime image reference
        required: true
      web_image:
        description: Approved web runtime image reference
        required: true
      api_image_id:
        description: Optional API runtime image ID recorded at build time; not used as a portable docker save/load gate
        required: false
        default: ""
      web_image_id:
        description: Optional web runtime image ID recorded at build time; not used as a portable docker save/load gate
        required: false
        default: ""
      runtime_image_bundle_name:
        description: Optional GitHub Actions artifact name containing docker save output
        required: false
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  validate-before-deploy:
    name: Validate before artifact deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout approved source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository and artifact deployment scripts
        run: |
          pnpm infra:scan-secrets
          bash -n infrastructure/deploy/build-runtime-images-from-artifact.sh
          bash -n infrastructure/deploy/deploy-staging-artifact.sh
          bash -n infrastructure/deploy/rollback-staging-artifact.sh
          bash -n infrastructure/validation/validate-artifact-deploy.sh
          cp deploy/staging/.env.staging.example /tmp/laborator-ci.env
          cp deploy/staging/.env.staging.example deploy/staging/.env.staging
          {
            echo "STAGING_RELEASE_VERSION=1.0.0-rc.1"
            echo "STAGING_SOURCE_COMMIT=${{ inputs.source_commit }}"
            echo "STAGING_ARTIFACT_SHA256=${{ inputs.release_artifact_sha256 }}"
            echo "STAGING_MIGRATION_VERSION=${{ inputs.migration_version }}"
            echo "STAGING_DEPLOYMENT_ID=ci-config-validation"
            echo "STAGING_RELEASE_IDENTITY_FILE=/tmp/laborator-release-identity.json"
            echo "STAGING_API_IMAGE=${{ inputs.api_image }}"
            echo "STAGING_WEB_IMAGE=${{ inputs.web_image }}"
          } >/tmp/laborator-release.env
          docker compose --env-file /tmp/laborator-ci.env --env-file /tmp/laborator-release.env -f deploy/staging/docker-compose.artifact.yml config >/tmp/laborator-compose-artifact.yml

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy approved artifact to staging VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - validate-before-deploy
    environment: staging

    steps:
      - name: Download approved RC artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.release_artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/laborator-rc1-artifact

      - name: Download runtime image bundle
        if: inputs.runtime_image_bundle_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.runtime_image_bundle_name }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/laborator-rc1-images

      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_laborator_deploy
          chmod 600 ~/.ssh/id_laborator_deploy
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy approved artifact to staging
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_ARTIFACT_SHA256: ${{ inputs.release_artifact_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          MIGRATION_VERSION: ${{ inputs.migration_version }}
          API_IMAGE: ${{ inputs.api_image }}
          WEB_IMAGE: ${{ inputs.web_image }}
        run: |
          set -Eeuo pipefail
          artifact_file="$(find /tmp/laborator-rc1-artifact -type f -name '*.tar.gz' | head -n 1)"
          test -n "$artifact_file"
          actual_sha="$(sha256sum "$artifact_file" | awk '{print $1}')"
          test "$actual_sha" = "$RELEASE_ARTIFACT_SHA256"
          ssh -i ~/.ssh/id_laborator_deploy -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" \
            "mkdir -p '${DEPLOY_PATH}/.releases/incoming'"
          scp -i ~/.ssh/id_laborator_deploy -P "${VPS_PORT:-22}" "$artifact_file" \
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/.releases/incoming/"
          runtime_bundle_verified=false
          if [ -d /tmp/laborator-rc1-images ]; then
            image_bundle="$(find /tmp/laborator-rc1-images -type f -name '*.tar' | head -n 1 || true)"
            if [ -z "$image_bundle" ]; then
              echo "::error title=Runtime bundle validation::Runtime image bundle artifact does not contain a .tar bundle."
              exit 1
            fi
            provenance_file="$(find /tmp/laborator-rc1-artifact -type f -name '*.provenance.json' | head -n 1 || true)"
            if [ -z "$provenance_file" ]; then
              echo "::error title=Runtime bundle validation::Runtime image bundle was provided, but release provenance is missing."
              exit 1
            fi
            expected_bundle_sha="$(python3 - \
              "$provenance_file" \
              "$SOURCE_COMMIT" \
              "$RELEASE_ARTIFACT_SHA256" \
              "$MIGRATION_VERSION" \
              "$API_IMAGE" \
              "$WEB_IMAGE" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              provenance = json.load(handle)

          runtime_images = provenance.get("runtimeImages", {})
          value = runtime_images.get("bundleSha256")
          if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{64}", value):
              raise SystemExit("release provenance does not contain runtimeImages.bundleSha256")
          checks = (
              ("source.commit", provenance.get("source", {}).get("commit"), sys.argv[2]),
              (
                  "releaseArtifact.sha256",
                  provenance.get("releaseArtifact", {}).get("sha256"),
                  sys.argv[3],
              ),
              (
                  "releaseArtifact.migrationVersion",
                  provenance.get("releaseArtifact", {}).get("migrationVersion"),
                  sys.argv[4],
              ),
              ("runtimeImages.apiImage", runtime_images.get("apiImage"), sys.argv[5]),
              ("runtimeImages.webImage", runtime_images.get("webImage"), sys.argv[6]),
          )
          for field, actual, expected in checks:
              if actual != expected:
                  raise SystemExit(
                      f"release provenance {field} does not match the approved deploy input"
                  )
          print(value, end="")
          PY
          )"
            actual_bundle_sha="$(sha256sum "$image_bundle" | awk '{print $1}')"
            if [ "$actual_bundle_sha" != "$expected_bundle_sha" ]; then
              echo "::error title=Runtime bundle validation::Runtime image bundle SHA-256 mismatch. expected=${expected_bundle_sha} actual=${actual_bundle_sha}"
              exit 1
            fi
            runtime_bundle_verified=true
            scp -i ~/.ssh/id_laborator_deploy -P "${VPS_PORT:-22}" "$image_bundle" \
              "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/.releases/incoming/"
          fi
          if [ "$runtime_bundle_verified" != "true" ] && \
            { [[ "$API_IMAGE" != *@sha256:* ]] || [[ "$WEB_IMAGE" != *@sha256:* ]]; }; then
            echo "::error title=Runtime image validation::Tagged runtime images require a SHA-256-verified provenance-bound runtime bundle."
            exit 1
          fi

      - name: Deploy remotely without rebuilding
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_ARTIFACT_NAME: ${{ inputs.release_artifact_name }}
          RELEASE_ARTIFACT_SHA256: ${{ inputs.release_artifact_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          MIGRATION_VERSION: ${{ inputs.migration_version }}
          API_IMAGE: ${{ inputs.api_image }}
          WEB_IMAGE: ${{ inputs.web_image }}
          API_IMAGE_ID: ${{ inputs.api_image_id }}
          WEB_IMAGE_ID: ${{ inputs.web_image_id }}
          RUNTIME_IMAGE_BUNDLE_NAME: ${{ inputs.runtime_image_bundle_name }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/id_laborator_deploy -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" \
            "set -Eeuo pipefail
             cd '${DEPLOY_PATH}'
             artifact_file='.releases/incoming/${RELEASE_ARTIFACT_NAME}.tar.gz'
             [ -f \"\$artifact_file\" ] || { echo 'Approved release artifact is missing on staging.' >&2; exit 1; }
             remote_artifact_sha=\$(sha256sum \"\$artifact_file\" | awk '{print \$1}')
             [ \"\$remote_artifact_sha\" = '${RELEASE_ARTIFACT_SHA256}' ] || { echo 'Transferred release artifact SHA-256 mismatch.' >&2; exit 1; }
             image_bundle=''
             if [ -n '${RUNTIME_IMAGE_BUNDLE_NAME}' ]; then image_bundle='.releases/incoming/${RUNTIME_IMAGE_BUNDLE_NAME}.tar'; fi
             if [ -n \"\$image_bundle\" ]; then docker load -i \"\$image_bundle\"; fi
             bootstrap_dir=\$(mktemp -d '.releases/deploy-bootstrap.XXXXXX')
             trap 'rm -rf \"\$bootstrap_dir\"' EXIT
             tar -xzf \"\$artifact_file\" -C \"\$bootstrap_dir\" infrastructure/deploy infrastructure/scripts
             \"\$bootstrap_dir/infrastructure/deploy/deploy-staging-artifact.sh\" \
               --artifact \"\$artifact_file\" \
               --sha256 '${RELEASE_ARTIFACT_SHA256}' \
               --source-commit '${SOURCE_COMMIT}' \
               --migration-version '${MIGRATION_VERSION}' \
               --api-image '${API_IMAGE}' \
               --web-image '${WEB_IMAGE}' \
               ${API_IMAGE_ID:+--api-image-id '${API_IMAGE_ID}'} \
               ${WEB_IMAGE_ID:+--web-image-id '${WEB_IMAGE_ID}'}"

      - name: Summary
        run: |
          {
            echo "## Staging artifact deploy"
            echo ""
            echo "- Source commit: ${{ inputs.source_commit }}"
            echo "- Artifact: ${{ inputs.release_artifact_name }}"
            echo "- Artifact SHA-256: ${{ inputs.release_artifact_sha256 }}"
            echo "- Runtime image bundle digest is verified from provenance when provided."
            echo "- Deploy command uses artifact verification, portable runtime labels, and docker compose --no-build."
          } >> "$GITHUB_STEP_SUMMARY"

# Operational readiness compatibility marker:
# deploy-staging.sh --ref
