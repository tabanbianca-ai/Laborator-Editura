name: Staging Deploy

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Approved source commit to deploy
        required: true
      approval_id:
        description: Existing human-approved VPS Operations deployment approval ID
        required: true
      release_artifact_name:
        description: GitHub Actions artifact name containing the approved RC tarball
        required: true
      release_artifact_sha256:
        description: Expected SHA-256 for the approved RC tarball
        required: true
      artifact_run_id:
        description: Workflow run ID that uploaded the approved RC artifact
        required: true
      migration_version:
        description: Expected database migration version
        required: true
      api_image:
        description: Approved API runtime image reference
        required: true
      web_image:
        description: Approved web runtime image reference
        required: true
      api_image_id:
        description: Optional API runtime image ID recorded at build time; not used as a portable docker save/load gate
        required: false
        default: ""
      web_image_id:
        description: Optional web runtime image ID recorded at build time; not used as a portable docker save/load gate
        required: false
        default: ""
      runtime_image_bundle_name:
        description: GitHub Actions artifact name containing the provenance-bound docker save output
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  validate-before-deploy:
    name: Validate before artifact deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout approved source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Validate source and approval inputs
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVAL_ID: ${{ inputs.approval_id }}
          RELEASE_ARTIFACT_NAME: ${{ inputs.release_artifact_name }}
        run: |
          set -Eeuo pipefail
          fail() {
            echo "::error title=Approved deployment input validation::$1" >&2
            exit 1
          }
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail "source_commit must be a full lowercase 40-character Git SHA."
          [[ -n "${APPROVAL_ID//[[:space:]]/}" ]] || fail "approval_id is required; an unapproved deployment is forbidden."
          [[ "$(git rev-parse HEAD)" == "$SOURCE_COMMIT" ]] || fail "Checked-out source does not match source_commit."
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse origin/main)" == "$SOURCE_COMMIT" ]] || fail "source_commit must equal current origin/main."
          expected_artifact_name="laborator-editura-1.0.0-rc.1-${SOURCE_COMMIT:0:8}"
          [[ "$RELEASE_ARTIFACT_NAME" == "$expected_artifact_name" ]] || fail "release_artifact_name must match the approved source commit."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository and artifact deployment scripts
        run: |
          pnpm infra:scan-secrets
          bash -n infrastructure/deploy/build-runtime-images-from-artifact.sh
          bash -n infrastructure/deploy/deploy-staging-artifact.sh
          bash -n infrastructure/deploy/rollback-staging-artifact.sh
          bash -n infrastructure/validation/validate-artifact-deploy.sh
          cp deploy/staging/.env.staging.example /tmp/laborator-ci.env
          cp deploy/staging/.env.staging.example deploy/staging/.env.staging
          {
            echo "STAGING_RELEASE_VERSION=1.0.0-rc.1"
            echo "STAGING_SOURCE_COMMIT=${{ inputs.source_commit }}"
            echo "STAGING_ARTIFACT_SHA256=${{ inputs.release_artifact_sha256 }}"
            echo "STAGING_MIGRATION_VERSION=${{ inputs.migration_version }}"
            echo "STAGING_DEPLOYMENT_ID=ci-config-validation"
            echo "STAGING_RELEASE_IDENTITY_FILE=/tmp/laborator-release-identity.json"
            echo "STAGING_API_IMAGE=${{ inputs.api_image }}"
            echo "STAGING_WEB_IMAGE=${{ inputs.web_image }}"
          } >/tmp/laborator-release.env
          docker compose --env-file /tmp/laborator-ci.env --env-file /tmp/laborator-release.env -f deploy/staging/docker-compose.artifact.yml config >/tmp/laborator-compose-artifact.yml

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy-approved:
    name: Execute through the approved deployment gateway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - validate-before-deploy
    environment: staging

    steps:
      - name: Download approved RC artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.release_artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/laborator-rc1-artifact

      - name: Download runtime image bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.runtime_image_bundle_name }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/laborator-rc1-images

      - name: Verify approved artifact identity
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ARTIFACT_NAME: ${{ inputs.release_artifact_name }}
          RELEASE_ARTIFACT_SHA256: ${{ inputs.release_artifact_sha256 }}
          MIGRATION_VERSION: ${{ inputs.migration_version }}
          API_IMAGE: ${{ inputs.api_image }}
          WEB_IMAGE: ${{ inputs.web_image }}
          RUNTIME_IMAGE_BUNDLE_NAME: ${{ inputs.runtime_image_bundle_name }}
        run: |
          set -Eeuo pipefail
          fail() {
            echo "::error title=Approved release identity validation::$1" >&2
            exit 1
          }
          artifact_file="$(find /tmp/laborator-rc1-artifact -type f -name '*.tar.gz' | head -n 1)"
          [[ -n "$artifact_file" ]] || fail "The release artifact archive is missing."
          [[ "$(basename "$artifact_file")" == "${RELEASE_ARTIFACT_NAME}.tar.gz" ]] || fail "The downloaded artifact filename does not match release_artifact_name."
          actual_sha="$(sha256sum "$artifact_file" | awk '{print $1}')"
          [[ "$actual_sha" == "$RELEASE_ARTIFACT_SHA256" ]] || fail "Release artifact SHA-256 mismatch."

          manifest_file="$(mktemp)"
          trap 'rm -f "$manifest_file"' EXIT
          tar -xOf "$artifact_file" RELEASE_ARTIFACT_MANIFEST.json >"$manifest_file" || fail "RELEASE_ARTIFACT_MANIFEST.json is missing from the archive."
          provenance_file="$(find /tmp/laborator-rc1-artifact -type f -name '*.provenance.json' | head -n 1 || true)"
          [[ -n "$provenance_file" ]] || fail "Release provenance is missing."
          image_bundle="$(find /tmp/laborator-rc1-images -type f -name '*.tar' | head -n 1 || true)"
          [[ -n "$image_bundle" ]] || fail "Runtime image bundle artifact does not contain a .tar bundle."
          [[ "$(basename "$image_bundle")" == "${RUNTIME_IMAGE_BUNDLE_NAME}.tar" ]] || fail "Runtime image bundle filename does not match runtime_image_bundle_name."

          expected_bundle_sha="$(python3 - \
            "$manifest_file" \
            "$provenance_file" \
            "$SOURCE_COMMIT" \
            "$RELEASE_ARTIFACT_NAME" \
            "$RELEASE_ARTIFACT_SHA256" \
            "$MIGRATION_VERSION" \
            "$API_IMAGE" \
            "$WEB_IMAGE" \
            "$RUNTIME_IMAGE_BUNDLE_NAME" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              manifest = json.load(handle)
          with open(sys.argv[2], "r", encoding="utf-8") as handle:
              provenance = json.load(handle)

          runtime_images = provenance.get("runtimeImages", {})
          value = runtime_images.get("bundleSha256")
          if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{64}", value):
              raise SystemExit("release provenance does not contain runtimeImages.bundleSha256")
          checks = (
              ("manifest.source.commit", manifest.get("source", {}).get("commit"), sys.argv[3]),
              ("manifest.database.latestMigration", manifest.get("database", {}).get("latestMigration"), sys.argv[6]),
              ("source.commit", provenance.get("source", {}).get("commit"), sys.argv[3]),
              ("releaseArtifact.actionsArtifactName", provenance.get("releaseArtifact", {}).get("actionsArtifactName"), sys.argv[4]),
              (
                  "releaseArtifact.sha256",
                  provenance.get("releaseArtifact", {}).get("sha256"),
                  sys.argv[5],
              ),
              (
                  "releaseArtifact.migrationVersion",
                  provenance.get("releaseArtifact", {}).get("migrationVersion"),
                  sys.argv[6],
              ),
              ("runtimeImages.apiImage", runtime_images.get("apiImage"), sys.argv[7]),
              ("runtimeImages.webImage", runtime_images.get("webImage"), sys.argv[8]),
              ("runtimeImages.bundleArtifactName", runtime_images.get("bundleArtifactName"), sys.argv[9]),
          )
          for field, actual, expected in checks:
              if actual != expected:
                  raise SystemExit(
                      f"release provenance {field} does not match the approved deploy input"
                  )
          print(value, end="")
          PY
          )"
          actual_bundle_sha="$(sha256sum "$image_bundle" | awk '{print $1}')"
          [[ "$actual_bundle_sha" == "$expected_bundle_sha" ]] || fail "Runtime image bundle SHA-256 mismatch."

          echo "APPROVED_RUNTIME_BUNDLE_SHA256=$actual_bundle_sha" >> "$GITHUB_ENV"

      - name: Authorize and execute only the existing approved deployment
        shell: bash
        env:
          VPS_OPERATIONS_ACTION_URL: ${{ vars.VPS_OPERATIONS_ACTION_URL }}
          VPS_ACTION_BEARER_TOKEN: ${{ secrets.VPS_ACTION_BEARER_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVAL_ID: ${{ inputs.approval_id }}
        run: |
          set -Eeuo pipefail
          fail() {
            echo "::error title=Approved deployment gateway::$1" >&2
            exit 1
          }
          [[ "$VPS_OPERATIONS_ACTION_URL" == https://* ]] || fail "VPS_OPERATIONS_ACTION_URL must be configured as HTTPS."
          [[ -n "$VPS_ACTION_BEARER_TOKEN" ]] || fail "VPS_ACTION_BEARER_TOKEN is not configured."
          [[ -n "${APPROVAL_ID//[[:space:]]/}" ]] || fail "approval_id is required; an unapproved deployment is forbidden."

          gateway="${VPS_OPERATIONS_ACTION_URL%/}"
          payload="$(python3 - "$SOURCE_COMMIT" "$APPROVAL_ID" <<'PY'
          import json
          import sys
          print(json.dumps({"ref": sys.argv[1], "approvalId": sys.argv[2]}), end="")
          PY
          )"

          call_gateway() {
            local action="$1"
            local response_file="$2"
            local phase="$3"
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 60 \
              -H "Authorization: Bearer ${VPS_ACTION_BEARER_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "${gateway}/actions/vps-operations/${action}" >"$response_file"
            python3 - "$response_file" "$SOURCE_COMMIT" "$APPROVAL_ID" "$phase" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              result = json.load(handle)
          if not isinstance(result, dict):
              raise SystemExit("deployment gateway response must be a JSON object")
          if result.get("error"):
              raise SystemExit("deployment gateway returned an error")
          for key in ("ok", "success", "approved", "authorized", "executed"):
              if key in result and result[key] is not True:
                  raise SystemExit(f"deployment gateway returned {key}=false")
          if "ref" in result and result["ref"] != sys.argv[2]:
              raise SystemExit("deployment gateway source commit mismatch")
          if "approvalId" in result and result["approvalId"] != sys.argv[3]:
              raise SystemExit("deployment gateway approval ID mismatch")
          status = str(result.get("status", "")).upper()
          if status in {"DENIED", "REJECTED", "EXPIRED", "FAILED", "ERROR", "PENDING"}:
              raise SystemExit(f"deployment gateway returned non-authorized status: {status}")
          phase = sys.argv[4]
          positive = (
              result.get("ok") is True
              or result.get("success") is True
              or (phase == "authorize" and result.get("authorized") is True)
              or (phase == "execute" and result.get("executed") is True)
              or (
                  phase == "authorize"
                  and status in {"APPROVED", "AUTHORIZED", "READY"}
              )
              or (
                  phase == "execute"
                  and status in {"EXECUTED", "SUCCESS", "COMPLETED", "STARTED"}
              )
          )
          if not positive:
              raise SystemExit("deployment gateway response lacks explicit success evidence")
          PY
          }

          authorize_response="$(mktemp)"
          execute_response="$(mktemp)"
          trap 'rm -f "$authorize_response" "$execute_response"' EXIT
          call_gateway "authorize-deploy" "$authorize_response" "authorize"
          call_gateway "execute-approved-deploy" "$execute_response" "execute"

      - name: Summary
        run: |
          {
            echo "## Approved staging artifact deployment"
            echo ""
            echo "- Approval: verified through the controlled VPS Operations lifecycle"
            echo "- Source commit: ${{ inputs.source_commit }}"
            echo "- Artifact: ${{ inputs.release_artifact_name }}"
            echo "- Artifact SHA-256: ${{ inputs.release_artifact_sha256 }}"
            echo "- Runtime image bundle SHA-256: $APPROVED_RUNTIME_BUNDLE_SHA256"
            echo "- Artifact identity and provenance were verified before authorization."
            echo "- Execution was delegated to the existing deploy-approved gateway; this workflow has no direct VPS deployment path."
          } >> "$GITHUB_STEP_SUMMARY"

# Operational readiness compatibility marker:
# deploy-staging.sh --ref
