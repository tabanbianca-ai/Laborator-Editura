name: Release Artifact Build

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full commit SHA from main to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifact-build-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  build-release-artifacts:
    name: Build verified release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout requested source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Verify source commit belongs to main
        env:
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -Eeuo pipefail
          [[ "$REQUESTED_SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          resolved_source_commit="$(git rev-parse --verify "${REQUESTED_SOURCE_COMMIT}^{commit}")"
          test "$(git rev-parse HEAD)" = "$resolved_source_commit"
          git merge-base --is-ancestor "$resolved_source_commit" origin/main
          echo "SOURCE_COMMIT=$resolved_source_commit" >> "$GITHUB_ENV"
          echo "SOURCE_SHORT_COMMIT=$(git rev-parse --short "$resolved_source_commit")" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan for committed secrets
        run: pnpm infra:scan-secrets

      - name: Validate configuration
        run: pnpm validate:config

      - name: Validate shell syntax
        run: |
          find infrastructure deploy/staging/scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n

      - name: Validate Docker Compose configuration
        run: |
          cp deploy/staging/.env.staging.example /tmp/laborator-release-build.env
          cp /tmp/laborator-release-build.env deploy/staging/.env.staging
          docker compose --env-file /tmp/laborator-release-build.env -f deploy/staging/docker-compose.staging.yml config

      - name: Run TypeScript checks
        run: pnpm typecheck

      - name: Run format check
        run: pnpm format:check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Run build
        run: pnpm build

      - name: Create release artifact and SBOM
        run: |
          node scripts/create-rc1-artifact.mjs
          node scripts/generate-rc1-sbom.mjs

      - name: Resolve verified release metadata
        run: |
          set -Eeuo pipefail
          fail() {
            echo "::error title=Release artifact metadata resolution::$1" >&2
            exit 1
          }
          require_file() {
            local description="$1"
            local path="$2"
            if [[ ! -f "$path" ]]; then
              fail "Missing ${description}: ${path}. The packaging step must generate this file for source commit ${SOURCE_COMMIT}."
            fi
          }
          release_artifact_name="laborator-editura-1.0.0-rc.1-${SOURCE_SHORT_COMMIT}"
          release_artifact_path="artifacts/releases/v1.0/rc1/${release_artifact_name}.tar.gz"
          release_metadata_path="artifacts/releases/v1.0/rc1/${release_artifact_name}.artifact.json"
          release_checksum_path="${release_artifact_path}.sha256"
          require_file "release archive" "$release_artifact_path"
          require_file "release metadata" "$release_metadata_path"
          require_file "release checksum" "$release_checksum_path"
          if ! release_artifact_sha256="$(node -e 'const fs=require("node:fs"); const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (!/^[0-9a-f]{64}$/.test(data.artifact?.sha256 ?? "")) process.exit(1); process.stdout.write(data.artifact.sha256)' "$release_metadata_path")"; then
            fail "Release metadata is invalid or does not contain artifact.sha256 as a lowercase 64-character SHA-256: ${release_metadata_path}."
          fi
          if ! migration_version="$(node -e 'const fs=require("node:fs"); const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (typeof data.database?.latestMigration !== "string" || data.database.latestMigration.length === 0) process.exit(1); process.stdout.write(data.database.latestMigration)' "$release_metadata_path")"; then
            fail "Release metadata is invalid or does not contain database.latestMigration: ${release_metadata_path}."
          fi
          checksum_sha256="$(awk '{print $1}' "$release_checksum_path")"
          actual_sha256="$(sha256sum "$release_artifact_path" | awk '{print $1}')"
          if [[ ! "$checksum_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            fail "Checksum file does not start with a lowercase 64-character SHA-256: ${release_checksum_path}."
          fi
          if [[ "$release_artifact_sha256" != "$checksum_sha256" ]]; then
            fail "SHA-256 mismatch between metadata (${release_artifact_sha256}) and checksum file (${checksum_sha256}) for ${release_artifact_name}."
          fi
          if [[ "$release_artifact_sha256" != "$actual_sha256" ]]; then
            fail "SHA-256 mismatch between metadata (${release_artifact_sha256}) and release archive (${actual_sha256}) for ${release_artifact_path}."
          fi
          runtime_image_bundle_name="${release_artifact_name}-runtime-images"
          runtime_metadata_artifact_name="${release_artifact_name}-runtime-metadata"
          api_image="laborator-api:${SOURCE_SHORT_COMMIT}-${GITHUB_RUN_ID}"
          web_image="laborator-web:${SOURCE_SHORT_COMMIT}-${GITHUB_RUN_ID}"
          {
            echo "RELEASE_ARTIFACT_NAME=$release_artifact_name"
            echo "RELEASE_ARTIFACT_PATH=$release_artifact_path"
            echo "RELEASE_METADATA_PATH=$release_metadata_path"
            echo "RELEASE_CHECKSUM_PATH=$release_checksum_path"
            echo "RELEASE_ARTIFACT_SHA256=$release_artifact_sha256"
            echo "MIGRATION_VERSION=$migration_version"
            echo "RUNTIME_IMAGE_BUNDLE_NAME=$runtime_image_bundle_name"
            echo "RUNTIME_METADATA_ARTIFACT_NAME=$runtime_metadata_artifact_name"
            echo "RUNTIME_IMAGE_BUNDLE_PATH=artifacts/releases/v1.0/rc1/${runtime_image_bundle_name}.tar"
            echo "RUNTIME_METADATA_PATH=artifacts/releases/v1.0/rc1/${runtime_metadata_artifact_name}.json"
            echo "PROVENANCE_PATH=artifacts/releases/v1.0/rc1/${release_artifact_name}.provenance.json"
            echo "API_IMAGE=$api_image"
            echo "WEB_IMAGE=$web_image"
          } >> "$GITHUB_ENV"

      - name: Build runtime images from verified artifact
        run: |
          infrastructure/deploy/build-runtime-images-from-artifact.sh \
            --artifact "$RELEASE_ARTIFACT_PATH" \
            --sha256 "$RELEASE_ARTIFACT_SHA256" \
            --source-commit "$SOURCE_COMMIT" \
            --api-image "$API_IMAGE" \
            --web-image "$WEB_IMAGE" \
            --output-metadata "$RUNTIME_METADATA_PATH" \
            --output-image-bundle "$RUNTIME_IMAGE_BUNDLE_PATH"

      - name: Generate run-specific provenance
        env:
          RELEASE_SBOM_PATH: docs/releases/v1.0/rc1-sbom.json
        run: node scripts/create-release-provenance.mjs

      - name: Export runtime image identities
        run: |
          api_image_id="$(node -e 'const fs=require("node:fs"); const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(data.apiImageId)' "$RUNTIME_METADATA_PATH")"
          web_image_id="$(node -e 'const fs=require("node:fs"); const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(data.webImageId)' "$RUNTIME_METADATA_PATH")"
          test -n "$api_image_id"
          test -n "$web_image_id"
          echo "API_IMAGE_ID=$api_image_id" >> "$GITHUB_ENV"
          echo "WEB_IMAGE_ID=$web_image_id" >> "$GITHUB_ENV"

      - name: Upload verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.RELEASE_ARTIFACT_PATH }}
            ${{ env.RELEASE_CHECKSUM_PATH }}
            ${{ env.RELEASE_METADATA_PATH }}
            docs/releases/v1.0/rc1-sbom.json
            ${{ env.PROVENANCE_PATH }}

      - name: Upload runtime image bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RUNTIME_IMAGE_BUNDLE_NAME }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: ${{ env.RUNTIME_IMAGE_BUNDLE_PATH }}

      - name: Upload runtime image metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RUNTIME_METADATA_ARTIFACT_NAME }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ env.RUNTIME_METADATA_PATH }}

      - name: Write release artifact summary
        run: |
          {
            echo "## Verified release artifacts"
            echo ""
            echo "- source_commit: \`$SOURCE_COMMIT\`"
            echo "- artifact_run_id: \`$GITHUB_RUN_ID\`"
            echo "- release_artifact_name: \`$RELEASE_ARTIFACT_NAME\`"
            echo "- release_artifact_sha256: \`$RELEASE_ARTIFACT_SHA256\`"
            echo "- migration_version: \`$MIGRATION_VERSION\`"
            echo "- api_image: \`$API_IMAGE\`"
            echo "- web_image: \`$WEB_IMAGE\`"
            echo "- api_image_id: \`$API_IMAGE_ID\`"
            echo "- web_image_id: \`$WEB_IMAGE_ID\`"
            echo "- runtime_image_bundle_name: \`$RUNTIME_IMAGE_BUNDLE_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"
