name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository and infrastructure validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Scan for committed secrets
        run: bash infrastructure/validation/scan-secrets.sh

      - name: Validate configuration examples
        run: node scripts/validate-configuration.mjs

      - name: Validate shell syntax
        run: |
          find infrastructure deploy/staging/scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n

      - name: Validate Docker Compose config
        run: |
          cp deploy/staging/.env.staging.example /tmp/laborator-ci.env
          cp /tmp/laborator-ci.env deploy/staging/.env.staging
          docker compose --env-file /tmp/laborator-ci.env -f deploy/staging/docker-compose.staging.yml config

      - name: Validate systemd unit syntax
        run: systemd-analyze verify infrastructure/systemd/*.service infrastructure/systemd/*.timer || true

      - name: Validate Nginx template
        run: bash infrastructure/validation/validate-nginx-template.sh infrastructure/nginx/laborator-staging.conf.template

  mvp-validation:
    name: MVP contract validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @laborator/shared

      - name: API contract and integration tests
        run: node --test apps/api/tests/*.test.mjs

      - name: DB migration runtime and backup tests
        run: node --test packages/db/tests/*.test.mjs

      - name: Shared JSON Master tests
        run: pnpm --filter @laborator/shared test

      - name: Fixture JSON validation
        run: |
          node -e "const fs = require('node:fs'); const files = ['apps/api/fixtures/mvp-e2e-validation.json', 'apps/api/fixtures/mvp-operational-workflow.json']; for (const file of files) { JSON.parse(fs.readFileSync(file, 'utf8')); console.log('valid', file); }"

  typecheck:
    name: Typecheck when dependencies are available
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies if package access is available
        id: dependencies
        shell: bash
        run: |
          set +e
          corepack enable
          corepack prepare pnpm@10.12.1 --activate
          pnpm install --frozen-lockfile
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Dependencies installed; typecheck will run."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Typecheck skipped::Dependency installation failed or package access is unavailable. Contract validation remains required; run pnpm install --frozen-lockfile && pnpm typecheck when dependencies are available."
          fi

          exit 0

      - name: Run TypeScript checks
        if: steps.dependencies.outputs.available == 'true'
        run: pnpm typecheck

      - name: Run format check
        if: steps.dependencies.outputs.available == 'true'
        run: pnpm format:check

      - name: Run lint
        if: steps.dependencies.outputs.available == 'true'
        run: pnpm lint

      - name: Run tests
        if: steps.dependencies.outputs.available == 'true'
        run: pnpm test

      - name: Run build
        if: steps.dependencies.outputs.available == 'true'
        run: pnpm build

      - name: Vulnerability scan
        if: steps.dependencies.outputs.available == 'true'
        run: pnpm audit --audit-level high

      - name: Document skipped typecheck
        if: steps.dependencies.outputs.available != 'true'
        run: |
          echo "Typecheck skipped because dependencies were unavailable in this CI run."
          echo "Required follow-up when package access is available: pnpm install --frozen-lockfile && pnpm typecheck"

  vulnerability-scan:
    name: Filesystem vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
