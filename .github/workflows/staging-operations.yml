name: Staging Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        type: choice
        options:
          - health
          - backup
          - backup-dry-run
          - restore-dry-run
          - rollback
      backup_path:
        description: Backup path for restore-dry-run
        required: false
      rollback_ref:
        description: Previous commit for rollback
        required: false
      confirm:
        description: Confirmation token for rollback, must be ROLLBACK
        required: false

permissions:
  contents: read

concurrency:
  group: staging-operations
  cancel-in-progress: false

jobs:
  run-operation:
    name: Run staging operation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_laborator_deploy
          chmod 600 ~/.ssh/id_laborator_deploy
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run operation
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          OPERATION: ${{ inputs.operation }}
          BACKUP_PATH: ${{ inputs.backup_path }}
          ROLLBACK_REF: ${{ inputs.rollback_ref }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          case "$OPERATION" in
            health)
              remote_cmd="cd '${DEPLOY_PATH}' && infrastructure/monitoring/monitor-laborator.sh"
              ;;
            backup)
              remote_cmd="cd '${DEPLOY_PATH}' && infrastructure/backup/backup-laborator.sh --config /etc/laborator/infrastructure.env"
              ;;
            backup-dry-run)
              remote_cmd="cd '${DEPLOY_PATH}' && infrastructure/backup/backup-laborator.sh --config /etc/laborator/infrastructure.env --dry-run"
              ;;
            restore-dry-run)
              test -n "$BACKUP_PATH"
              remote_cmd="cd '${DEPLOY_PATH}' && infrastructure/backup/restore-dry-run.sh --backup '${BACKUP_PATH}'"
              ;;
            rollback)
              test -n "$ROLLBACK_REF"
              test "$CONFIRM" = "ROLLBACK"
              remote_cmd="cd '${DEPLOY_PATH}' && infrastructure/deploy/rollback-staging.sh --ref '${ROLLBACK_REF}' --confirm ROLLBACK"
              ;;
            *)
              echo "Unsupported operation: $OPERATION" >&2
              exit 1
              ;;
          esac
          ssh -i ~/.ssh/id_laborator_deploy -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" "$remote_cmd"

      - name: Summary
        run: |
          {
            echo "## Staging operation"
            echo ""
            echo "- Operation: ${{ inputs.operation }}"
            echo "- Completed through SSH key authentication."
          } >> "$GITHUB_STEP_SUMMARY"

